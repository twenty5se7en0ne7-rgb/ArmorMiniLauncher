
name: Build ArmorMiniLauncher APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip ArmorMiniLauncher_Final.zip
          cd ArmorMiniLauncher
          echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: |
          cd ArmorMiniLauncher
          gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArmorMiniLauncher-apk
          path: ArmorMiniLauncher/app/build/outputs/apk/release/*.apk
          
