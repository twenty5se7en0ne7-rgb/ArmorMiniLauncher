name: Build ArmorMiniLauncher APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q ArmorMiniLauncher_Fixed_Ready.zip -d extracted
          ROOT=$(find extracted -name gradlew -type f | head -n 1)
          if [ -z "$ROOT" ]; then
            ROOT=$(find extracted -name build.gradle -o -name build.gradle.kts | head -n 1)
          fi
          if [ -z "$ROOT" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          DIR=$(dirname "$ROOT")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArmorMiniLauncher-apk
          path: "**/build/outputs/apk/release/*.apk"
