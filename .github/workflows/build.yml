name: Build ArmorMiniLauncher APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q ArmorMiniLauncher_Fixed_Ready2.zip -d extracted
          ROOT=$(find extracted -name build.gradle -o -name build.gradle.kts | head -1)
          PROJECT_DIR=$(dirname "$ROOT")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArmorMiniLauncher-apk
          path: "**/build/outputs/apk/release/*.apk"
